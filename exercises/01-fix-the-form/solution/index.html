<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 01 — Fix the Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <form id="signup" class="card">
      <fieldset>
        <legend>Create your account</legend>

        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Ada Lovelace" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ada@example.com" required />

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 555 0100" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required />

        <button type="submit">Sign up</button>
        <p id="result" class="result" aria-live="polite"></p>
      </fieldset>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
