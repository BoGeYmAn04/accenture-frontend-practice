<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 02 — Style the Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <article class="profile-card">
      <div class="avatar" aria-hidden="true">AL</div>
      <h1 class="name">Ada Lovelace</h1>
      <p class="role">Frontend Engineer</p>
      <p class="bio">Writes clean, semantic markup and obsesses over spacing and typography.</p>
      <ul class="tags">
        <li class="tag">HTML</li>
        <li class="tag">CSS</li>
        <li class="tag">JavaScript</li>
      </ul>
      <button class="follow-btn" type="button">Follow</button>
    </article>
  </main>
</body>
</html>
