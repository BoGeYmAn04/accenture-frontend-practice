<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 13 — Accordion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1>FAQ</h1>
    <section class="accordion">
      <div class="accordion-item">
        <button class="accordion-header" type="button" aria-expanded="false">
          What is HTML?
          <span class="icon">+</span>
        </button>
        <div class="accordion-body">
          <p>HTML is the standard markup language used to structure content on the web.</p>
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-header" type="button" aria-expanded="false">
          What is CSS?
          <span class="icon">+</span>
        </button>
        <div class="accordion-body">
          <p>CSS describes how HTML elements should be displayed on screen.</p>
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-header" type="button" aria-expanded="false">
          What is JavaScript?
          <span class="icon">+</span>
        </button>
        <div class="accordion-body">
          <p>JavaScript makes web pages interactive and dynamic.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
