<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 16 — Image Carousel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="carousel" aria-label="Image carousel">
      <div class="slides">
        <div class="slide active">1</div>
        <div class="slide">2</div>
        <div class="slide">3</div>
        <div class="slide">4</div>
      </div>

      <button id="prev" class="nav prev" type="button" aria-label="Previous slide">Prev</button>
      <button id="next" class="nav next" type="button" aria-label="Next slide">Next</button>

      <div class="dots">
        <button class="dot active" data-index="0" type="button" aria-label="Go to slide 1"></button>
        <button class="dot" data-index="1" type="button" aria-label="Go to slide 2"></button>
        <button class="dot" data-index="2" type="button" aria-label="Go to slide 3"></button>
        <button class="dot" data-index="3" type="button" aria-label="Go to slide 4"></button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
