<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 11 — Responsive Card Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1>Our team</h1>
    <section class="grid">
      <article class="card">
        <div class="thumb"></div>
        <h2>Ada Lovelace</h2>
        <p>Frontend Engineer</p>
      </article>
      <article class="card">
        <div class="thumb"></div>
        <h2>Alan Turing</h2>
        <p>Backend Engineer</p>
      </article>
      <article class="card">
        <div class="thumb"></div>
        <h2>Grace Hopper</h2>
        <p>Compiler Engineer</p>
      </article>
      <article class="card">
        <div class="thumb"></div>
        <h2>Linus Torvalds</h2>
        <p>Kernel Engineer</p>
      </article>
      <article class="card">
        <div class="thumb"></div>
        <h2>Margaret Hamilton</h2>
        <p>Systems Engineer</p>
      </article>
      <article class="card">
        <div class="thumb"></div>
        <h2>Dennis Ritchie</h2>
        <p>Language Designer</p>
      </article>
    </section>
  </main>
</body>
</html>
