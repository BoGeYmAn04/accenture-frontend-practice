<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 09 — Dark-Mode Toggle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="topbar">
        <h1>Dark Mode</h1>
        <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
      </div>
      <p class="muted">Toggle the theme. The colours are driven by CSS variables set on the root element.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
