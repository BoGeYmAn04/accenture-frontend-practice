<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 04 — Center It</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1>Center the dot — three ways</h1>
    <div class="stages">
      <section class="stage" id="stage-flex">
        <span class="dot">flex</span>
      </section>
      <section class="stage" id="stage-grid">
        <span class="dot">grid</span>
      </section>
      <section class="stage" id="stage-abs">
        <span class="dot">abs</span>
      </section>
    </div>
  </main>
</body>
</html>
